/* Nullable Client extra: ClickGUI demo + auth. All classes prefixed rg- */
.rg-panel{width:100%;border:1px solid #262626;border-radius:14px;background:#0d0d0f;
  font-family:JetBrains Mono,ui-monospace,monospace;color:#e4e4e7;overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.35);font-size:12px}
.rg-phead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  background:#141416;border-bottom:1px solid #232326;color:#a1a1aa}
.rg-phead b{color:#fafafa;font-size:12px}
.rg-phead .rg-count{background:#22c55e22;color:#4ade80;border-radius:20px;padding:1px 9px;font-size:11px}
.rg-search{padding:8px 10px 0}
.rg-search input{width:100%;box-sizing:border-box;background:#111113;border:1px solid #232326;
  border-radius:8px;color:#e4e4e7;padding:7px 10px;font:inherit;font-size:12px;outline:none}
.rg-search input:focus{border-color:#52525b}
.rg-cats{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap}
.rg-cats button{background:#111113;border:1px solid #232326;color:#8a8a93;border-radius:20px;
  padding:4px 11px;font:inherit;font-size:11px;cursor:pointer}
.rg-cats button.on{background:#fafafa;color:#000;border-color:#fafafa;font-weight:700}
.rg-list{max-height:220px;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.rg-list::-webkit-scrollbar{width:6px}
.rg-list::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
.rg-mod{border:1px solid #232326;border-radius:9px;background:#111113;overflow:hidden}
.rg-mhead{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;user-select:none}
.rg-mhead:hover{background:#17171a}
.rg-dot{width:7px;height:7px;border-radius:50%;background:#52525b;flex-shrink:0}
.rg-mod.on .rg-dot{background:#22c55e;box-shadow:0 0 6px #22c55e}
.rg-mname{flex:1;color:#d4d4d8}
.rg-mod.on .rg-mname{color:#fff}
.rg-tg{width:32px;height:18px;border-radius:10px;background:#3f3f46;border:none;cursor:pointer;
  position:relative;flex-shrink:0;transition:background .15s}
.rg-tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;transition:left .15s}
.rg-mod.on .rg-tg{background:#22c55e}
.rg-mod.on .rg-tg::after{left:16px}
.rg-set{display:none;border-top:1px solid #232326;padding:8px 9px;flex-direction:column;gap:8px}
.rg-mod.open .rg-set{display:flex}
.rg-srow{display:flex;align-items:center;gap:8px;color:#8a8a93;font-size:11px}
.rg-srow label{flex:0 0 86px}
.rg-srow output{color:#e4e4e7;min-width:30px;text-align:right}
.rg-srow input[type=range]{flex:1;accent-color:#22c55e;height:3px;cursor:pointer}
.rg-bind{margin-left:auto;background:#0a0a0a;border:1px solid #3f3f46;color:#e4e4e7;border-radius:6px;
  padding:2px 9px;font:inherit;font-size:11px;cursor:pointer}
.rg-bind:hover{border-color:#22c55e}
.rg-bind.wait{border-color:#22c55e;color:#22c55e;animation:rgblink 1s infinite}
@keyframes rgblink{50%{opacity:.4}}
.rg-empty{padding:14px;text-align:center;color:#52525b}
/* header auth button */
.rg-authbtn{border:1px solid #3f3f46;border-radius:999px;background:transparent;color:inherit;
  padding:6px 15px;font:600 12px Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.rg-authbtn:hover{border-color:#22c55e;background:#22c55e18}
/* modal */
.rg-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:16px}
.rg-card{width:100%;max-width:380px;background:#111113;border:1px solid #2a2a2e;border-radius:18px;
  padding:26px 24px;color:#e4e4e7;font-family:Manrope,sans-serif;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.rg-card h3{margin:0 0 4px;font-size:20px;font-weight:800}
.rg-card p.rg-sub{margin:0 0 16px;color:#8a8a93;font-size:13px}
.rg-tabs{display:flex;background:#0a0a0a;border-radius:10px;padding:3px;margin-bottom:16px}
.rg-tabs button{flex:1;border:none;background:transparent;color:#8a8a93;font:700 13px Manrope,sans-serif;
  padding:8px;border-radius:8px;cursor:pointer}
.rg-tabs button.on{background:#232326;color:#fff}
.rg-card label{display:block;font-size:12px;color:#8a8a93;margin:10px 0 5px;font-weight:600}
.rg-card input[type=email],.rg-card input[type=password],.rg-card input[type=text]{width:100%;
  box-sizing:border-box;background:#0a0a0a;border:1px solid #2a2a2e;border-radius:10px;color:#fff;
  padding:10px 12px;font:500 14px Manrope,sans-serif;outline:none}
.rg-card input:focus{border-color:#22c55e}
.rg-err{display:none;color:#f87171;font-size:12px;margin-top:10px;min-height:16px}
.rg-err.show{display:block}
.rg-go{width:100%;margin-top:14px;border:none;border-radius:999px;background:#fafafa;color:#000;
  font:800 14px Manrope,sans-serif;padding:12px;cursor:pointer}
.rg-go:hover{background:#22c55e;color:#000}
.rg-x{float:right;background:none;border:none;color:#52525b;font-size:18px;cursor:pointer;padding:0 0 8px 8px}
.rg-x:hover{color:#fff}
/* cabinet */
.rg-me{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rg-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#166534);
  display:grid;place-items:center;font:800 20px Manrope,sans-serif;color:#000;flex-shrink:0}
.rg-me b{font-size:15px;display:block;word-break:break-all}
.rg-me span{font-size:12px;color:#8a8a93}
.rg-rows{margin:14px 0;border:1px solid #232326;border-radius:12px;overflow:hidden}
.rg-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;
  background:#0d0d0f}
.rg-row+.rg-row{border-top:1px solid #1c1c1f}
.rg-row span:first-child{color:#8a8a93}
.rg-row span:last-child{color:#fff;font-weight:700;font-family:JetBrains Mono,monospace;font-size:12px}
.rg-free{background:#22c55e22!important;color:#4ade80!important;border-radius:6px;padding:2px 10px}
.rg-out{width:100%;background:transparent;border:1px solid #3f3f46;color:#e4e4e7;border-radius:999px;
  font:700 13px Manrope,sans-serif;padding:10px;cursor:pointer}
.rg-out:hover{border-color:#f87171;color:#f87171}
/* full-page cabinet */
.rg-page{position:fixed;inset:0;z-index:200;background:#0a0a0a;
  background-image:radial-gradient(ellipse 60% 40% at 50% 0%,#14200f 0%,transparent 70%);
  overflow-y:auto;font-family:Manrope,sans-serif;color:#e4e4e7}
.rg-wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.rg-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.rg-back{background:#141416;border:1px solid #2a2a2e;color:#e4e4e7;border-radius:999px;
  padding:8px 18px;font:700 13px Manrope,sans-serif;cursor:pointer}
.rg-back:hover{border-color:#22c55e}
.rg-brand{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#52525b}
.rg-hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#151517,#0d150c);
  border:1px solid #2a2a2e;border-radius:20px;padding:24px;margin-bottom:14px}
.rg-bigava{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#4ade80,#166534);
  display:grid;place-items:center;font:800 38px Manrope,sans-serif;color:#052e12;flex-shrink:0}
.rg-hinfo h2{margin:0;font-size:26px;font-weight:800;color:#fff;word-break:break-all}
.rg-hinfo p{margin:3px 0 0;color:#8a8a93;font-size:13px;word-break:break-all}
.rg-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rg-chip{background:#1c1c1f;border:1px solid #2a2a2e;color:#e4e4e7;border-radius:8px;
  padding:5px 13px;font:700 12px JetBrains Mono,monospace}
.rg-chipfree{background:#22c55e22!important;color:#4ade80!important;border-color:#22c55e55!important}
.rg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rg-cell{background:#111113;border:1px solid #232326;border-radius:16px;padding:16px}
.rg-cell span{display:block;color:#8a8a93;font-size:12px;font-weight:600;margin-bottom:6px}
.rg-cell b{color:#fff;font:700 18px JetBrains Mono,monospace}
.rg-prem{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(135deg,#1a2e12,#111113);border:1px solid #2c4a1e;
  border-radius:16px;padding:18px;margin-bottom:18px}
.rg-prem b{display:block;color:#fff;font-size:15px;margin-bottom:3px}
.rg-prem span{color:#8a8a93;font-size:12px}
.rg-prem button{background:#22c55e;border:none;color:#052e12;font:800 13px Manrope,sans-serif;
  border-radius:999px;padding:10px 24px;flex-shrink:0}
.rg-outpage{max-width:320px;margin:0 auto;display:block}
@media(max-width:560px){.rg-hero{flex-direction:column;text-align:center}.rg-hinfo h2{font-size:22px}}

  <body>
    <div id="root"></div>
    <script>
/* Nullable Client extra: interactive ClickGUI demo + localStorage auth (no backend) */
(function () {
  "use strict";

  var T = {
    ru: {
      guiTitle: "Nullable Client — ClickGUI", demo: "демо", search: "Поиск модулей...",
      enabled: "вкл", empty: "Ничего не найдено",
      login: "Войти", reg: "Регистрация", email: "Почта", pass: "Пароль", user: "Ник",
      loginId: "Почта или ник",
      doLogin: "Войти", doReg: "Создать аккаунт",
      loginSub: "Войди, чтобы открыть личный кабинет", regSub: "1 почта = 1 аккаунт = 1 UID",
      cabinet: "Личный кабинет", cab: "Кабинет", logout: "Выйти",
      uid: "UID", regDate: "Дата регистрации", sub: "Подписка", mods: "Модулей включено",
      free: "FREE",
      errMail: "Введи корректную почту", errPass: "Пароль — минимум 6 символов",
      errTaken: "Эта почта уже зарегистрирована", errNo: "Аккаунт не найден", errWrong: "Неверный пароль",
      errUser: "Ник — минимум 3 символа", errUserTaken: "Этот ник уже занят"
    },
    en: {
      guiTitle: "Nullable Client — ClickGUI", demo: "demo", search: "Search modules...",
      enabled: "on", empty: "Nothing found",
      login: "Log in", reg: "Sign up", email: "Email", pass: "Password", user: "Username",
      loginId: "Email or username",
      doLogin: "Log in", doReg: "Create account",
      loginSub: "Log in to open your cabinet", regSub: "1 email = 1 account = 1 UID",
      cabinet: "Cabinet", cab: "Cabinet", logout: "Log out",
      uid: "UID", regDate: "Registered", sub: "Plan", mods: "Modules enabled",
      free: "FREE",
      errMail: "Enter a valid email", errPass: "Password — 6+ characters",
      errTaken: "Email already registered", errNo: "Account not found", errWrong: "Wrong password",
      errUser: "Username — 3+ characters", errUserTaken: "Username already taken"
    }
  };

  var MODS = [
    { c: "Combat", n: "KillAura", on: true, s: [{ k: "range", lo: 3, hi: 6, st: 0.1, v: 4.2 }, { k: "cps", lo: 1, hi: 20, st: 1, v: 12 }], b: "R" },
    { c: "Combat", n: "Velocity", on: true, s: [{ k: "chance", lo: 0, hi: 100, st: 1, v: 90 }], b: "V" },
    { c: "Combat", n: "AutoTotem", on: false, s: [], b: "T" },
    { c: "Combat", n: "AntiBot", on: true, s: [], b: "B" },
    { c: "Movement", n: "Fly", on: false, s: [{ k: "speed", lo: 0.5, hi: 5, st: 0.1, v: 1.5 }], b: "F" },
    { c: "Movement", n: "Speed", on: true, s: [{ k: "speed", lo: 0.5, hi: 5, st: 0.1, v: 2.1 }], b: "G" },
    { c: "Movement", n: "NoSlow", on: true, s: [], b: "N" },
    { c: "Movement", n: "Step", on: false, s: [{ k: "height", lo: 1, hi: 3, st: 0.5, v: 1.5 }], b: "H" },
    { c: "Visuals", n: "ESP", on: true, s: [], b: "E" },
    { c: "Visuals", n: "Tracers", on: false, s: [], b: "X" },
    { c: "Visuals", n: "HUD", on: true, s: [], b: "U" },
    { c: "Visuals", n: "Chams", on: false, s: [], b: "C" },
    { c: "Player", n: "NoFall", on: true, s: [], b: "O" },
    { c: "Player", n: "ChestStealer", on: false, s: [{ k: "delay", lo: 0, hi: 500, st: 10, v: 120 }], b: "Z" },
    { c: "Player", n: "Scaffold", on: false, s: [], b: "Y" }
  ];
  var CATS = ["Combat", "Movement", "Visuals", "Player"];

  function lang() { return document.documentElement.lang === "en" ? "en" : "ru"; }
  function t(k) { return T[lang()][k]; }

  function load(k, fb) {
    try { var v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }
    catch (e) { return fb; }
  }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ---------- ClickGUI state ---------- */
  var gui = load("nullable_gui_v1", null);
  if (!gui) {
    gui = {};
    MODS.forEach(function (m) {
      gui[m.n] = { on: m.on, b: m.b, s: {} };
      m.s.forEach(function (x) { gui[m.n].s[x.k] = x.v; });
    });
  }
  var activeCat = CATS[0], query = "", openMod = null;

  function enabledCount() {
    var n = 0;
    Object.keys(gui).forEach(function (k) { if (gui[k].on) n++; });
    return n;
  }

  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    return d.firstChild;
  }

  function renderPanel(host) {
    host.innerHTML = "";
    var p = el('<div class="rg-panel"></div>');
    var head = el('<div class="rg-phead"><b></b><span class="rg-count"></span></div>');
    head.firstChild.textContent = T[lang()].guiTitle;
    head.lastChild.textContent = enabledCount() + " " + T[lang()].enabled;
    p.appendChild(head);

    var s = el('<div class="rg-search"><input></div>');
    s.firstChild.placeholder = T[lang()].search;
    s.firstChild.value = query;
    s.firstChild.addEventListener("input", function (e) { query = e.target.value; renderPanel(host); keepFocus(); });
    p.appendChild(s);

    var cats = el('<div class="rg-cats"></div>');
    CATS.forEach(function (c) {
      var b = document.createElement("button");
      b.textContent = c;
      if (c === activeCat) b.className = "on";
      b.addEventListener("click", function () { activeCat = c; renderPanel(host); });
      cats.appendChild(b);
    });
    p.appendChild(cats);

    var list = el('<div class="rg-list"></div>');
    var shown = 0;
    MODS.forEach(function (m) {
      if (m.c !== activeCat) return;
      if (query && m.n.toLowerCase().indexOf(query.toLowerCase()) < 0) return;
      shown++;
      var st = gui[m.n];
      var mod = el('<div class="rg-mod' + (st.on ? " on" : "") + (openMod === m.n ? " open" : "") + '"></div>');
      var h = el('<div class="rg-mhead"><span class="rg-dot"></span></div>');
      var nm = document.createElement("span");
      nm.className = "rg-mname"; nm.textContent = m.n;
      var tg = document.createElement("button");
      tg.className = "rg-tg"; tg.title = m.n;
      h.appendChild(nm); h.appendChild(tg);
      h.addEventListener("click", function (e) {
        if (e.target === tg) { st.on = !st.on; }
        else { openMod = (openMod === m.n) ? null : m.n; }
        save("nullable_gui_v1", gui);
        renderPanel(host);
      });
      mod.appendChild(h);

      var set = el('<div class="rg-set"></div>');
      m.s.forEach(function (x) {
        var row = el('<div class="rg-srow"></div>');
        var lb = document.createElement("label"); lb.textContent = x.k;
        var rg = document.createElement("input");
        rg.type = "range"; rg.min = x.lo; rg.max = x.hi; rg.step = x.st; rg.value = st.s[x.k];
        var out = document.createElement("output"); out.textContent = st.s[x.k];
        rg.addEventListener("input", function () { st.s[x.k] = parseFloat(rg.value); out.textContent = rg.value; save("nullable_gui_v1", gui); });
        row.appendChild(lb); row.appendChild(rg); row.appendChild(out);
        set.appendChild(row);
      });
      var brow = el('<div class="rg-srow"><label>bind</label></div>');
      var bb = document.createElement("button");
      bb.className = "rg-bind"; bb.textContent = "[" + st.b + "]";
      bb.addEventListener("click", function (ev) {
        ev.stopPropagation();
        bb.textContent = "[...]"; bb.classList.add("wait");
        var done = function (e) {
          e.preventDefault();
          var k = (e.key || "?").toUpperCase();
          st.b = k.length > 1 ? k : k;
          save("nullable_gui_v1", gui);
          bb.textContent = "[" + st.b + "]"; bb.classList.remove("wait");
          window.removeEventListener("keydown", done, true);
        };
        window.addEventListener("keydown", done, true);
      });
      brow.appendChild(bb);
      set.appendChild(brow);
      mod.appendChild(set);
      list.appendChild(mod);
    });
    if (!shown) {
      var e2 = el('<div class="rg-empty"></div>');
      e2.textContent = T[lang()].empty;
      list.appendChild(e2);
    }
    p.appendChild(list);
    host.appendChild(p);

    function keepFocus() {
      var inp = p.querySelector(".rg-search input");
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }

  var guiObserved = false;
  function ensureGui() {
    var img = document.querySelector("section#about img[alt='Nullable Client']");
    if (!img) return;
    if (img.dataset.rgDone) return;
    var host = document.createElement("div");
    host.id = "rg-gui-host";
    host.style.width = "100%";
    img.replaceWith(host);
    renderPanel(host);
    // если React перерисует карточку и вернёт img — повторим
    if (guiObserved) return;
    guiObserved = true;
    new MutationObserver(function () {
      var again = document.querySelector("section#about img[alt='Nullable Client']");
      if (again && !document.getElementById("rg-gui-host")) ensureGui();
    }).observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
  }

  function ensureDownloadBtn() {
    var hdr = document.querySelector("header");
    if (!hdr) return;
    var existing = document.getElementById("rg-auth-btn");
    if (!existing) {
      var a = document.createElement("a");
      a.id = "rg-auth-btn";
      a.className = "rg-authbtn";
      a.href = "https://github.com/TongilazIsKINGofOkak/Tds/releases/latest/download/NullableClient-1.21.4.exe";
      a.target = "_blank";
      a.rel = "noopener";
      a.style.textDecoration = "none";
      a.style.display = "inline-flex";
      a.style.alignItems = "center";
      hdr.appendChild(a);
      existing = a;
    }
    existing.textContent = lang() === "en" ? "Download loader" : "Скачать лоадер";
  }

  var lastLang = document.documentElement.lang;
  setInterval(function () {
    ensureGui();
    ensureDownloadBtn();
    var host = document.getElementById("rg-gui-host");
    if (host && document.documentElement.lang !== lastLang) {
      lastLang = document.documentElement.lang;
      renderPanel(host);
    }
  }, 800);
})();

    </script>
